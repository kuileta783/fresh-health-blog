<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fh-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#fh-grad)"/>
  
  <!-- Subtle Glow Effect -->
  <circle cx="256" cy="256" r="180" fill="white" opacity="0.08" />

  <!-- Stylized Wellness Leaf -->
  <path d="M 256 110 C 330 110 390 170 390 244 C 390 318 330 378 256 378 C 256 300 290 240 350 210 C 280 210 230 160 256 110 Z" fill="url(#leaf-grad)" opacity="0.35"/>
  
  <!-- Stylized FH Monogram -->
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="190" fill="#FFFFFF" text-anchor="middle" letter-spacing="-6">FH</text>
  
  <!-- Health Cross / Leaf accent dot -->
  <circle cx="370" cy="150" r="24" fill="#34D399" />
</svg>
